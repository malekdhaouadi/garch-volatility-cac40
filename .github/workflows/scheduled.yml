name: Scheduled forecast

on:
  schedule:
    - cron: "0 6 * * 1-5"       # 06:00 UTC Mon-Fri, before EU market open
  workflow_dispatch:            # manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnlopt-dev gfortran libblas-dev liblapack-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Restore renv
        run: |
          Rscript -e 'install.packages("renv", repos = "https://cloud.r-project.org")'
          Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Generate live config
        run: |
          Rscript -e '
            cfg <- yaml::read_yaml("config.yml")
            cfg$end_date <- as.character(Sys.Date())
            yaml::write_yaml(cfg, "config.live.yml")
          '

      - name: Run pipeline
        run: Rscript run_pipeline.R config.live.yml

      - name: Upload latest.rds as artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-model
          path: |
            outputs/latest.rds
            outputs/models/latest_fits.rds
          retention-days: 30


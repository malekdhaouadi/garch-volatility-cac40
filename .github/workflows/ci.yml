name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      # Install Ubuntu system libraries required by Matrix, mgcv, ks, rugarch
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnlopt-dev \
            gfortran \
            libblas-dev \
            liblapack-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Run tests
        run: Rscript tests/run_tests.R